services:
  - type: web
    name: warmibot-api-grupo12
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: warmibot-db-grupo12
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: CACHE_TTL_SECONDS
        value: "60"
      - key: ALLOWED_ORIGINS
        value: https://warmibot.invalid
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: grupo12@uea.edu.ec
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

databases:
  - name: warmibot-db-grupo12
    plan: free
    databaseName: warmibot
    user: warmibot
    ipAllowList: []
