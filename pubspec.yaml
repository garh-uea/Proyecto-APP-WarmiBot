name: warmibot
description: WarmiBot - Asistente Virtual con identidad amazónica. Flutter 3.44+
publish_to: none
version: 1.0.0+2

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Estado ───────────────────────────────────────────────────────────────────
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.0.5
  go_router: ^18.0.0

  # ── Voz STT / TTS ────────────────────────────────────────────────────────────
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  # ── Notificaciones / Alarmas ─────────────────────────────────────────────────
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0

  # ── HTTP / APIs ───────────────────────────────────────────────────────────────
  dio: ^5.9.0
  json_annotation: ^4.12.0
  xml: ^7.0.1

  # ── Base de datos local (Recordatorios) ──────────────────────────────────────
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # ── Permisos ──────────────────────────────────────────────────────────────────
  permission_handler: ^12.0.3

  # ── Utilidades ───────────────────────────────────────────────────────────────
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^11.0.0
  url_launcher: ^6.3.0
  share_plus: ^13.1.0
  string_similarity: ^2.0.0

  # ── UI / Animaciones ─────────────────────────────────────────────────────────
  lottie: ^3.1.2
  animated_text_kit: ^4.2.2
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

  # Fuentes opcionales (agregar archivos .ttf manualmente)
  # fonts:
  #   - family: WarmiFont
  #     fonts:
  #       - asset: assets/fonts/warmi_regular.ttf
